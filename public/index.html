<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道途 - 文字修仙游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zcool+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0d0d0d;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --bg-card: #1f1f1f;
      --text-primary: #e5e5e5;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-gold: #d4af37;
      --accent-gold-light: #f4cf57;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --border-color: #333333;
      --font-heading: 'Noto Serif SC', serif;
      --font-body: 'Noto Serif SC', serif;
    }
    html, body { height: 100%; font-family: var(--font-body); background: var(--bg-primary); color: var(--text-primary); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%); }
    .screen.hidden { display: none; }
    .auth-container, .char-create-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .game-title { text-align: center; margin-bottom: 30px; }
    .game-title h1 { font-family: var(--font-heading); font-size: 3rem; color: var(--accent-gold); text-shadow: 0 0 20px rgba(212,175,55,0.3); letter-spacing: 0.5rem; }
    .game-title .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px; }
    .auth-tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--text-secondary); font-family: var(--font-body); font-size: 1rem; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
    .auth-form { display: flex; flex-direction: column; gap: 15px; }
    .auth-form.hidden { display: none; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.85rem; }
    .form-group input { width: 100%; padding: 12px 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: var(--font-body); font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: var(--accent-gold); }
    .auth-btn, .create-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-gold) 0%, #b8962e 100%); border: none; border-radius: 6px; color: #000; font-family: var(--font-body); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .message { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.9rem; }
    .message.error { background: rgba(239,68,68,0.1); border: 1px solid var(--accent-red); color: var(--accent-red); }
    .message.success { background: rgba(16,185,129,0.1); border: 1px solid var(--accent-green); color: var(--accent-green); }
    .message.hidden { display: none; }
    .char-create-container h2 { text-align: center; color: var(--accent-gold); font-family: var(--font-heading); margin-bottom: 30px; }
    .gender-select { display: flex; gap: 20px; }
    .gender-option { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; }
    .gender-option:has(input:checked) { border-color: var(--accent-gold); background: rgba(212,175,55,0.1); }
    .gender-option input { display: none; }
    .spirit-root-options { display: flex; flex-direction: column; gap: 10px; }
    .root-option { display: flex; padding: 12px 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; }
    .root-option:has(input:checked) { border-color: var(--accent-gold); background: rgba(212,175,55,0.1); }
    .root-option input { display: none; }
    .root-info { display: flex; justify-content: space-between; width: 100%; }
    .root-name { color: var(--accent-gold); font-weight: 600; }
    .root-bonus { color: var(--text-secondary); font-size: 0.85rem; }
    #game-screen { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-primary); }
    .game-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .game-logo { font-family: var(--font-heading); font-size: 1.5rem; color: var(--accent-gold); }
    .server-status { color: var(--accent-green); font-size: 0.8rem; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .header-btn { padding: 6px 15px; background: transparent; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-secondary); cursor: pointer; font-family: var(--font-body); }
    .header-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
    .game-container { display: grid; grid-template-columns: 260px 1fr 280px; flex: 1; overflow: hidden; }
    .sidebar-left { background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: 15px; overflow-y: auto; }
    .sidebar-right { background: var(--bg-secondary); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
    .status-section, .location-section, .online-section, .chat-section, .leaderboard-section { padding: 15px; border-bottom: 1px solid var(--border-color); }
    .sidebar-left h3, .sidebar-right h3 { color: var(--accent-gold); font-family: var(--font-heading); font-size: 1rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .character-avatar { text-align: center; padding: 15px; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 15px; }
    .avatar-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .avatar-name { font-size: 1.1rem; font-weight: 600; }
    .avatar-realm { font-size: 0.85rem; color: var(--accent-purple); margin-top: 4px; }
    .status-bars { margin-bottom: 15px; }
    .status-bar { margin-bottom: 12px; }
    .status-bar label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
    .bar-container { position: relative; height: 20px; background: var(--bg-primary); border-radius: 10px; overflow: hidden; }
    .bar { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
    .hp-bar { background: linear-gradient(90deg, var(--accent-red), #ff6b6b); }
    .qi-bar { background: linear-gradient(90deg, var(--accent-blue), #60a5fa); }
    .bar-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.75rem; color: var(--text-primary); }
    .status-details { font-size: 0.85rem; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
    .detail-label { color: var(--text-secondary); }
    .detail-value { color: var(--text-primary); }
    .detail-value.gold { color: var(--accent-gold); }
    .location-info { background: var(--bg-tertiary); padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    .location-name { color: var(--accent-green); font-weight: 600; margin-bottom: 4px; }
    .location-desc { font-size: 0.8rem; color: var(--text-secondary); }
    .location-travel { display: flex; flex-wrap: wrap; gap: 6px; }
    .travel-btn { padding: 6px 10px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; font-family: var(--font-body); }
    .travel-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
    .game-main { display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; }
    .world-header { padding: 15px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
    .world-header h2 { font-family: var(--font-heading); color: var(--accent-gold); font-size: 1.2rem; }
    .game-log { flex: 1; padding: 15px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .log-entry { padding: 8px 12px; background: var(--bg-secondary); border-radius: 6px; font-size: 0.9rem; line-height: 1.5; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .log-entry.system { border-left: 3px solid var(--accent-blue); }
    .log-entry.combat { border-left: 3px solid var(--accent-red); }
    .log-entry.treasure { border-left: 3px solid var(--accent-gold); }
    .log-entry.heal { border-left: 3px solid var(--accent-green); }
    .log-entry.levelup { border-left: 3px solid var(--accent-purple); background: rgba(139,92,246,0.1); }
    .action-panel { padding: 15px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
    .action-buttons { display: flex; gap: 10px; }
    .action-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 15px 10px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
    .action-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .action-btn.meditate:hover { border-color: var(--accent-blue); }
    .action-btn.explore:hover { border-color: var(--accent-green); }
    .action-btn.heal:hover { border-color: var(--accent-red); }
    .action-btn.refresh:hover { border-color: var(--accent-gold); }
    .action-icon { font-size: 1.5rem; }
    .action-name { font-size: 0.85rem; }
    .online-list { max-height: 150px; overflow-y: auto; }
    .online-user { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px solid var(--border-color); }
    .online-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; }
    .online-name { color: var(--text-primary); }
    .online-realm { color: var(--text-muted); font-size: 0.75rem; }
    .chat-section { flex: 1; display: flex; flex-direction: column; min-height: 200px; }
    .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 10px; }
    .chat-message { padding: 6px 0; font-size: 0.85rem; border-bottom: 1px solid var(--border-color); }
    .chat-sender { color: var(--accent-gold); font-weight: 600; }
    .chat-realm { color: var(--text-muted); font-size: 0.75rem; }
    .chat-text { color: var(--text-primary); margin-top: 2px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 8px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-family: var(--font-body); }
    .chat-input input:focus { outline: none; border-color: var(--accent-gold); }
    .chat-input button { padding: 8px 15px; background: var(--accent-gold); border: none; border-radius: 4px; color: #000; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
    .leaderboard { overflow-y: auto; }
    .leader-entry { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.8rem; border-bottom: 1px solid var(--border-color); }
    .leader-rank { color: var(--accent-gold); font-weight: 600; width: 25px; }
    .leader-name { flex: 1; color: var(--text-primary); }
    .leader-realm { color: var(--text-muted); font-size: 0.75rem; }
    .demo-badge { background: var(--accent-purple); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; margin-left: 10px; }
    @media (max-width: 992px) { .game-container { grid-template-columns: 1fr; } .sidebar-left, .sidebar-right { display: none; } }
  </style>
</head>
<body>
  <div id="auth-screen" class="screen">
    <div class="auth-container">
      <div class="game-title">
        <h1>道途</h1>
        <p class="subtitle">修仙世界由此开始</p>
      </div>
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">登录</button>
        <button class="tab-btn" data-tab="register">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <div class="form-group"><input type="text" id="login-username" placeholder="用户名" required></div>
        <div class="form-group"><input type="password" id="login-password" placeholder="密码" required></div>
        <button type="submit" class="auth-btn">登录</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <div class="form-group"><input type="text" id="register-username" placeholder="用户名 (3-20字符)" required></div>
        <div class="form-group"><input type="password" id="register-password" placeholder="密码 (至少6位)" required></div>
        <button type="submit" class="auth-btn">注册</button>
      </form>
      <div id="auth-message" class="message hidden"></div>
    </div>
  </div>
  <div id="char-create-screen" class="screen hidden">
    <div class="char-create-container">
      <h2>创建你的修仙角色</h2>
      <form id="char-create-form">
        <div class="form-group"><label>角色名称</label><input type="text" id="char-name" placeholder="2-10个字符" required></div>
        <div class="form-group">
          <label>性别</label>
          <div class="gender-select">
            <label class="gender-option"><input type="radio" name="gender" value="male" checked><span>男</span></label>
            <label class="gender-option"><input type="radio" name="gender" value="female"><span>女</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>灵根选择</label>
          <div class="spirit-root-options">
            <label class="root-option"><input type="radio" name="spiritRoot" value="天灵根" checked><div class="root-info"><span class="root-name">天灵根</span><span class="root-bonus">修炼速度极快 (x2.0)</span></div></label>
            <label class="root-option"><input type="radio" name="spiritRoot" value="单灵根"><div class="root-info"><span class="root-name">单灵根</span><span class="root-bonus">修炼速度较快 (x1.5)</span></div></label>
            <label class="root-option"><input type="radio" name="spiritRoot" value="双灵根"><div class="root-info"><span class="root-name">双灵根</span><span class="root-bonus">修炼速度一般 (x1.2)</span></div></label>
            <label class="root-option"><input type="radio" name="spiritRoot" value="三灵根"><div class="root-info"><span class="root-name">三灵根</span><span class="root-bonus">修炼速度较慢 (x1.0)</span></div></label>
            <label class="root-option"><input type="radio" name="spiritRoot" value="五行灵根"><div class="root-info"><span class="root-name">五行灵根</span><span class="root-bonus">修炼速度很慢 (x0.7)</span></div></label>
          </div>
        </div>
        <button type="submit" class="create-btn">开始修仙之路</button>
      </form>
      <div id="char-create-message" class="message hidden"></div>
    </div>
  </div>
  <div id="game-screen" class="screen hidden">
    <header class="game-header">
      <div class="header-left">
        <span class="game-logo">道途</span><span class="server-status">● 单机版</span>
        <span class="demo-badge">演示版</span>
      </div>
      <div class="header-right"><span id="player-name"></span><button id="logout-btn" class="header-btn">退出</button></div>
    </header>
    <div class="game-container">
      <aside class="sidebar-left">
        <div class="status-section">
          <h3>角色状态</h3>
          <div class="character-avatar">
            <div class="avatar-icon">⚔️</div>
            <div class="avatar-name" id="char-display-name"></div>
            <div class="avatar-realm" id="char-realm"></div>
          </div>
          <div class="status-bars">
            <div class="status-bar"><label>生命值</label><div class="bar-container"><div class="bar hp-bar" id="hp-bar"></div><span class="bar-text" id="hp-text">100/100</span></div></div>
            <div class="status-bar"><label>灵气值</label><div class="bar-container"><div class="bar qi-bar" id="qi-bar"></div><span class="bar-text" id="qi-text">0/100</span></div></div>
          </div>
          <div class="status-details">
            <div class="detail-row"><span class="detail-label">灵根</span><span class="detail-value" id="spirit-root"></span></div>
            <div class="detail-row"><span class="detail-label">境界</span><span class="detail-value" id="realm-level"></span></div>
            <div class="detail-row"><span class="detail-label">攻击力</span><span class="detail-value" id="attack"></span></div>
            <div class="detail-row"><span class="detail-label">防御力</span><span class="detail-value" id="defense"></span></div>
            <div class="detail-row"><span class="detail-label">金币</span><span class="detail-value gold" id="gold">0</span></div>
            <div class="detail-row"><span class="detail-label">声望</span><span class="detail-value" id="prestige">0</span></div>
          </div>
        </div>
        <div class="location-section">
          <h3>当前地点</h3>
          <div class="location-info"><div class="location-name" id="location-name">青云宗</div><div class="location-desc" id="location-desc">你所在的宗门</div></div>
          <div class="location-travel">
            <button class="travel-btn" data-location="1">青云宗</button>
            <button class="travel-btn" data-location="2">山脚</button>
            <button class="travel-btn" data-location="3">森林</button>
            <button class="travel-btn" data-location="4">峡谷</button>
            <button class="travel-btn" data-location="5">万魔渊</button>
          </div>
        </div>
      </aside>
      <main class="game-main">
        <div class="world-header"><h2 id="world-title">修仙世界</h2></div>
        <div class="game-log" id="game-log"><div class="log-entry system">欢迎来到道途修仙世界！</div><div class="log-entry system">这是单机演示版，数据保存在本地浏览器中。</div></div>
        <div class="action-panel">
          <div class="action-buttons">
            <button class="action-btn meditate" data-action="meditate"><span class="action-icon">🧘</span><span class="action-name">打坐修炼</span></button>
            <button class="action-btn explore" data-action="explore"><span class="action-icon">🔍</span><span class="action-name">外出历练</span></button>
            <button class="action-btn heal" data-action="heal"><span class="action-icon">💊</span><span class="action-name">购买丹药</span></button>
            <button class="action-btn refresh" data-action="refresh"><span class="action-icon">🔄</span><span class="action-name">刷新状态</span></button>
          </div>
        </div>
      </main>
      <aside class="sidebar-right">
        <div class="online-section"><h3>在线玩家</h3><div class="online-list" id="online-list"><div class="online-user"><span class="online-dot"></span><span class="online-name">你</span><span class="online-realm" id="self-realm"></span></div></div></div>
        <div class="chat-section">
          <h3>系统消息</h3>
          <div class="chat-messages" id="chat-messages"><div class="chat-message"><div class="chat-text">单机模式，无聊天功能</div></div></div>
        </div>
        <div class="leaderboard-section"><h3>境界榜</h3><div class="leaderboard" id="leaderboard"></div></div>
      </aside>
    </div>
  </div>
  <script>
    const SPIRIT_ROOTS = [{name:'天灵根',bonus:2.0},{name:'单灵根',bonus:1.5},{name:'双灵根',bonus:1.2},{name:'三灵根',bonus:1.0},{name:'五行灵根',bonus:0.7}];
    const REALMS = [{level:1,name:'炼气期一层',maxQi:100,reqQi:0},{level:2,name:'炼气期二层',maxQi:200,reqQi:150},{level:3,name:'炼气期三层',maxQi:350,reqQi:300},{level:4,name:'炼气期四层',maxQi:550,reqQi:500},{level:5,name:'炼气期五层',maxQi:800,reqQi:750},{level:6,name:'炼气期六层',maxQi:1100,reqQi:1000},{level:7,name:'炼气期七层',maxQi:1500,reqQi:1350},{level:8,name:'炼气期八层',maxQi:2000,reqQi:1800},{level:9,name:'炼气期九层',maxQi:2600,reqQi:2300},{level:10,name:'炼气期十层',maxQi:3300,reqQi:3000},{level:11,name:'筑基期',maxQi:5000,reqQi:4500},{level:12,name:'金丹期',maxQi:10000,reqQi:8000},{level:13,name:'元婴期',maxQi:20000,reqQi:15000}];
    const LOCATIONS = [{id:1,name:'青云宗',desc:'你所在的宗门，灵气充沛',danger:1},{id:2,name:'青云山脚',desc:'宗门外的山脚，有一些低阶妖兽',danger:2},{id:3,name:'青云森林',desc:'密林中常有修士历练',danger:3},{id:4,name:'落日峡谷',desc:'峡谷中弥漫着诡异的气息',danger:4},{id:5,name:'万魔渊',desc:'魔气纵横，是修士的禁地',danger:5}];
    const ENEMIES = [{name:'野兔',hp:20,attack:3,defense:1,qi:10,gold:5},{name:'野狼',hp:40,attack:8,defense:3,qi:25,gold:15},{name:'毒蛇',hp:35,attack:12,defense:2,qi:30,gold:20},{name:'山贼',hp:60,attack:15,defense:5,qi:50,gold:35},{name:'妖狐',hp:80,attack:20,defense:8,qi:80,gold:50},{name:'骷髅',hp:100,attack:25,defense:10,qi:120,gold:80},{name:'僵尸',hp:150,attack:30,defense:15,qi:180,gold:120},{name:'魔狼',hp:200,attack:40,defense:20,qi:250,gold:180}];
    const STORAGE_KEY = 'dao_path_save';
    let gameState = {users:{},currentUser:null,characters:{},leaderboard:[]};
    let currentCharacter = null;
    const authScreen = document.getElementById('auth-screen'), charCreateScreen = document.getElementById('char-create-screen'), gameScreen = document.getElementById('game-screen');
    const loginForm = document.getElementById('login-form'), registerForm = document.getElementById('register-form'), charCreateForm = document.getElementById('char-create-form');
    const tabBtns = document.querySelectorAll('.tab-btn'), authMessage = document.getElementById('auth-message'), charCreateMessage = document.getElementById('char-create-message');
    function loadState() { const saved = localStorage.getItem(STORAGE_KEY); if(saved) gameState = JSON.parse(saved); }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState)); }
    function showScreen(screen) { authScreen.classList.add('hidden'); charCreateScreen.classList.add('hidden'); gameScreen.classList.add('hidden'); screen.classList.remove('hidden'); }
    loadState();
    if(gameState.currentUser && gameState.characters[gameState.currentUser]) { currentCharacter = gameState.characters[gameState.currentUser]; showScreen(gameScreen); initGame(); }
    tabBtns.forEach(btn=>btn.addEventListener('click',()=>{tabBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(btn.dataset.tab==='login'){loginForm.classList.remove('hidden');registerForm.classList.add('hidden');}else{loginForm.classList.add('hidden');registerForm.classList.remove('hidden');}hide(authMessage);}));
    loginForm.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('login-username').value.trim(),p=document.getElementById('login-password').value;if(!gameState.users[u]||gameState.users[u]!==p){showMsg(authMessage,'用户名或密码错误','error');return;}gameState.currentUser=u;currentCharacter=gameState.characters[u];saveState();if(currentCharacter){showScreen(gameScreen);initGame();}else{showScreen(charCreateScreen);}});
    registerForm.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('register-username').value.trim(),p=document.getElementById('register-password').value;if(u.length<3||u.length>20){showMsg(authMessage,'用户名长度需在3-20个字符之间','error');return;}if(p.length<6){showMsg(authMessage,'密码长度至少6个字符','error');return;}if(gameState.users[u]){showMsg(authMessage,'用户名已被注册','error');return;}gameState.users[u]=p;gameState.currentUser=u;saveState();showMsg(authMessage,'注册成功！请创建你的角色','success');setTimeout(()=>{showScreen(charCreateScreen);},1000);});
    charCreateForm.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('char-name').value.trim(),gender=document.querySelector('input[name="gender"]:checked').value,spiritRoot=document.querySelector('input[name="spiritRoot"]:checked').value;if(name.length<2||name.length>10){showMsg(charCreateMessage,'名字长度需在2-10个字符之间','error');return;}const rootInfo=SPIRIT_ROOTS.find(r=>r.name===spiritRoot);currentCharacter={name,gender,spiritRoot,realmLevel:1,realmName:'炼气期一层',currentQi:0,maxQi:100,hp:100,maxHp:100,attack:10,defense:5,gold:0,prestige:0,locationId:1};gameState.characters[gameState.currentUser]=currentCharacter;saveState();showScreen(gameScreen);initGame();});
    function showMsg(el,text,type){el.textContent=text;el.className=`message ${type}`;}
    function hide(el){el.className='message hidden';}
    function initGame(){updateUI();addLog('欢迎回来，'+currentCharacter.name+'！','system');addLog('当前位于：'+getLocationName(currentCharacter.locationId),'system');updateLeaderboard();document.getElementById('self-realm').textContent=currentCharacter.realmName;}
    function updateUI(){document.getElementById('player-name').textContent=currentCharacter.name;document.getElementById('char-display-name').textContent=currentCharacter.name;document.getElementById('char-realm').textContent=currentCharacter.realmName;document.getElementById('hp-bar').style.width=(currentCharacter.hp/currentCharacter.maxHp*100)+'%';document.getElementById('hp-text').textContent=currentCharacter.hp+'/'+currentCharacter.maxHp;document.getElementById('qi-bar').style.width=(currentCharacter.currentQi/currentCharacter.maxQi*100)+'%';document.getElementById('qi-text').textContent=currentCharacter.currentQi+'/'+currentCharacter.maxQi;document.getElementById('spirit-root').textContent=currentCharacter.spiritRoot;document.getElementById('realm-level').textContent=currentCharacter.realmName;document.getElementById('attack').textContent=currentCharacter.attack;document.getElementById('defense').textContent=currentCharacter.defense;document.getElementById('gold').textContent=currentCharacter.gold;document.getElementById('prestige').textContent=currentCharacter.prestige;const loc=LOCATIONS.find(l=>l.id===currentCharacter.locationId);if(loc){document.getElementById('location-name').textContent=loc.name;document.getElementById('location-desc').textContent=loc.desc;}}
    function getLocationName(id){return LOCATIONS.find(l=>l.id===id)?.name||'未知';}
    function addLog(msg,type){const div=document.createElement('div');div.className=`log-entry ${type}`;div.textContent=msg;document.getElementById('game-log').appendChild(div);document.getElementById('game-log').scrollTop=document.getElementById('game-log').scrollHeight;}
    function updateLeaderboard(){const lb=Object.values(gameState.characters).sort((a,b)=>b.realmLevel-a.realmLevel||b.currentQi-a.currentQi).slice(0,10);const el=document.getElementById('leaderboard');el.innerHTML='';lb.forEach((c,i)=>{const div=document.createElement('div');div.className='leader-entry';div.innerHTML=`<span class="leader-rank">${i+1}</span><span class="leader-name">${c.name}</span><span class="leader-realm">${c.realmName}</span>`;el.appendChild(div);});}
    document.querySelectorAll('.action-btn').forEach(btn=>{btn.addEventListener('click',()=>{const action=btn.dataset.action;if(action==='refresh'){updateUI();addLog('刷新了角色状态','system');return;}if(action==='heal'){if(currentCharacter.gold<10){addLog('金币不足，需要10枚金币','system');return;}currentCharacter.gold-=10;currentCharacter.hp=currentCharacter.maxHp;saveState();updateUI();addLog('花费10枚金币，生命值已回满','heal');return;}if(action==='meditate'){const rootInfo=SPIRIT_ROOTS.find(r=>r.name===currentCharacter.spiritRoot);const qiGain=Math.floor((5+currentCharacter.realmLevel*2)*rootInfo.bonus);const realmInfo=REALMS.find(r=>r.level===currentCharacter.realmLevel);currentCharacter.currentQi=Math.min(currentCharacter.currentQi+qiGain,realmInfo.maxQi);let leveledUp=false;if(currentCharacter.currentQi>=realmInfo.reqQi&&currentCharacter.realmLevel<13){currentCharacter.realmLevel++;const next=REALMS.find(r=>r.level===currentCharacter.realmLevel);if(next){currentCharacter.realmName=next.name;currentCharacter.maxQi=next.maxQi;currentCharacter.attack+=2;currentCharacter.defense+=1;}leveledUp=true;}saveState();updateUI();addLog(`打坐修炼中获得${qiGain}点灵气！${leveledUp?'境界突破到'+currentCharacter.realmName+'！':''}`,leveledUp?'levelup':'system');return;}if(action==='explore'){const loc=LOCATIONS.find(l=>l.id===currentCharacter.locationId);const r=Math.random();if(r<0.4){const ei=Math.min(Math.floor(Math.random()*loc.danger*2),ENEMIES.length-1);const enemy=Object.assign({},ENEMIES[ei]);const charDmg=Math.max(1,currentCharacter.attack-enemy.defense+Math.floor(Math.random()*5));const enemyDmg=Math.max(1,enemy.attack-currentCharacter.defense+Math.floor(Math.random()*3));if(currentCharacter.hp>enemyDmg){const qiR=Math.floor(enemy.qi*(1+currentCharacter.realmLevel*0.1));const goldR=Math.floor(enemy.gold*(1+currentCharacter.realmLevel*0.1));currentCharacter.currentQi+=qiR;currentCharacter.gold+=goldR;saveState();updateUI();addLog(`遇到${enemy.name}，经过激战你获胜了！获得${qiR}点灵气和${goldR}枚金币`,'combat');}else{const hpLoss=Math.floor(enemyDmg*0.3);currentCharacter.hp=Math.max(1,currentCharacter.hp-hpLoss);saveState();updateUI();addLog(`遇到${enemy.name}，你被打败了！损失${hpLoss}点生命值`,'combat');}}else if(r<0.7){const goldF=Math.floor(Math.random()*20*currentCharacter.realmLevel);currentCharacter.gold+=goldF;saveState();updateUI();addLog(`在探索中发现了一个宝箱，里面有${goldF}枚金币！`,'treasure');}else{addLog('你四处探索，但什么都没有发现...','system');}}});});
    document.querySelectorAll('.travel-btn').forEach(btn=>{btn.addEventListener('click',()=>{const id=parseInt(btn.dataset.location);const loc=LOCATIONS.find(l=>l.id===id);if(loc){currentCharacter.locationId=id;saveState();updateUI();addLog('你来到了'+loc.name,'system');}});});
    document.getElementById('logout-btn').addEventListener('click',()=>{gameState.currentUser=null;currentCharacter=null;saveState();showScreen(authScreen);});
  </script>
</body>
</html>
